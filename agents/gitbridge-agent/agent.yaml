name: gitbridge-agent
display_name: GitBridge Agent
description: Agent for GitLab branches, merge requests, and pipelines.
enabled: false
entrypoint: "python3 -m src.main"
tools:
  - gitlab_check_connection
  - gitlab_get_merge_request
  - gitlab_get_merge_request_changes
  - gitlab_get_merge_request_discussions
  - gitlab_get_pipeline_status
  - gitlab_create_branch
  - gitlab_prepare_merge_request
  - gitlab_push_branch
  - gitlab_create_merge_request
  - jiraforge_code_updater
mcp_servers:
  - gitlab-mcp
