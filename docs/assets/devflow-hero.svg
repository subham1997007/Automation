<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Automation DevFlow</title>
  <desc id="desc">Controlled agentic development from work item to merge request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#17324d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1030" cy="75" r="190" fill="#38bdf8" opacity=".07"/>
  <circle cx="1120" cy="360" r="245" fill="#34d399" opacity=".06"/>
  <rect x="72" y="66" width="84" height="84" rx="22" fill="#0f2137" stroke="#38bdf8" stroke-width="2"/>
  <path d="M95 109h38M114 90v38" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <text x="184" y="113" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">Automation DevFlow</text>
  <text x="74" y="204" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600">Controlled agentic development</text>
  <text x="74" y="248" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Jira context → repository intelligence → tested code → GitLab merge request</text>
  <g transform="translate(74 302)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">
    <rect width="190" height="48" rx="24" fill="#0c4a6e" stroke="#38bdf8"/><text x="95" y="30" fill="#e0f2fe" text-anchor="middle">Human approvals</text>
    <rect x="210" width="210" height="48" rx="24" fill="#064e3b" stroke="#34d399"/><text x="315" y="30" fill="#d1fae5" text-anchor="middle">Local knowledge</text>
    <rect x="440" width="190" height="48" rx="24" fill="#312e81" stroke="#818cf8"/><text x="535" y="30" fill="#e0e7ff" text-anchor="middle">MCP-native</text>
  </g>
  <g transform="translate(875 128)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="210" height="150" rx="24" fill="#0b1f33" stroke="#475569" stroke-width="2"/>
    <path d="M45 51h120M45 78h88M45 105h105" stroke="#64748b" stroke-width="8"/>
    <circle cx="174" cy="116" r="39" fill="#052e2b" stroke="#34d399" stroke-width="3"/>
    <path d="m157 116 12 12 23-27" stroke="#6ee7b7" stroke-width="7"/>
  </g>
</svg>
