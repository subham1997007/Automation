<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">Automation DevFlow workflow</title>
  <desc id="desc">A Jira story flows through repository context, an AI proposal, human approval, implementation and tests, and a GitLab merge request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#64748b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="430" rx="24" fill="url(#bg)"/>
  <text x="700" y="54" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">From work item to reviewed merge request</text>
  <g stroke="#64748b" stroke-width="3" marker-end="url(#arrow)">
    <path d="M230 205h65"/><path d="M495 205h65"/><path d="M760 205h65"/><path d="M1025 205h65"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(50 125)"><rect width="180" height="160" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/><circle cx="90" cy="49" r="26" fill="#0284c7"/><text x="90" y="57" text-anchor="middle" font-size="24" fill="white">1</text><text x="90" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#0c4a6e">Jira story</text><text x="90" y="132" text-anchor="middle" font-size="14" fill="#475569">Goal and acceptance</text><text x="90" y="151" text-anchor="middle" font-size="14" fill="#475569">criteria</text></g>
    <g transform="translate(315 125)"><rect width="180" height="160" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><circle cx="90" cy="49" r="26" fill="#7c3aed"/><text x="90" y="57" text-anchor="middle" font-size="24" fill="white">2</text><text x="90" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#4c1d95">Context</text><text x="90" y="132" text-anchor="middle" font-size="14" fill="#475569">Code, docs and</text><text x="90" y="151" text-anchor="middle" font-size="14" fill="#475569">project rules</text></g>
    <g transform="translate(580 125)"><rect width="180" height="160" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><circle cx="90" cy="49" r="26" fill="#d97706"/><text x="90" y="57" text-anchor="middle" font-size="24" fill="white">3</text><text x="90" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#78350f">AI proposal</text><text x="90" y="132" text-anchor="middle" font-size="14" fill="#475569">Plan and impact</text><text x="90" y="151" text-anchor="middle" font-size="14" fill="#475569">shown first</text></g>
    <g transform="translate(845 125)"><rect width="180" height="160" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><circle cx="90" cy="49" r="26" fill="#16a34a"/><path d="m76 49 10 10 19-23" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#14532d">You approve</text><text x="90" y="132" text-anchor="middle" font-size="14" fill="#475569">Accept, change</text><text x="90" y="151" text-anchor="middle" font-size="14" fill="#475569">or reject</text></g>
    <g transform="translate(1090 125)"><rect width="260" height="160" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="130" cy="49" r="26" fill="#2563eb"/><text x="130" y="57" text-anchor="middle" font-size="24" fill="white">5</text><text x="130" y="103" text-anchor="middle" font-size="21" font-weight="700" fill="#1e3a8a">Code → tests → MR</text><text x="130" y="132" text-anchor="middle" font-size="14" fill="#475569">Execute approved work</text><text x="130" y="151" text-anchor="middle" font-size="14" fill="#475569">and preserve evidence</text></g>
  </g>
  <rect x="480" y="337" width="440" height="54" rx="27" fill="#0f172a"/>
  <text x="700" y="371" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#f8fafc">Consequential writes always cross an approval gate</text>
</svg>
